name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend-lint, dir: tms-backend, cmd: npm run lint:ci }
          - { name: backend-build, dir: tms-backend, cmd: npm run build }
          - { name: backend-test, dir: tms-backend, cmd: npm test -- --ci --maxWorkers=2 }
          - { name: frontend-lint, dir: tms-frontend, cmd: npm run lint }
          - { name: frontend-build, dir: tms-frontend, cmd: npm run build }
          - { name: frontend-test, dir: tms-frontend, cmd: npm test }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.name }}
        env:
          CMD: ${{ matrix.cmd }}
        run: bash -c "$CMD"

  # Automatic review is opt-in via the CLAUDE_AUTO_REVIEW repository variable;
  # a @claude-review PR comment triggers the same review on demand regardless.
  claude-review:
    needs: [checks]
    if: >-
      vars.CLAUDE_AUTO_REVIEW == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/claude-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
