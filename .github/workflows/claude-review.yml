name: Claude Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  review:
    # Only same-repo, non-draft PRs: fork PRs get no secrets, and a skipped
    # job still satisfies the required check. The condition sits here, not on
    # the caller: a skipped `uses:` job never reports this check, which would
    # leave it pending and block the merge.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a code review with the following focus areas:

            1. **Correctness** — bugs, edge cases, error handling
            2. **Security** — input validation, auth/session handling, secrets
            3. **Tests** — adequate coverage for the change, missing scenarios
            4. **Conventions** — follow the repo's CLAUDE.md rules

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations.

            Finally, write your verdict to the file claude-review-verdict in the
            repository root: the single word REQUEST_CHANGES if you found any
            blocking issue (a bug, a security problem, or a broken repo invariant),
            otherwise the single word APPROVE.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Write(claude-review-verdict)"

      - name: Enforce review verdict
        run: |
          verdict=$(cat claude-review-verdict 2>/dev/null || echo "MISSING")
          echo "Review verdict: $verdict"
          if [ "$verdict" != "APPROVE" ]; then
            echo "::error::Claude review did not approve this PR (verdict: $verdict)"
            exit 1
          fi
